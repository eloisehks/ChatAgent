  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        height: 800,
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        events: [
          {
            title: 'Product Launch',
            start: '2025-07-01',
          },
          {
            title: 'Appointment Title',
            start: '2025-07-03T10:00:00',
            end: '2025-07-03T11:00:00'
          },
          {
            title: 'Appointment Title 2',
            start: '2025-07-05T12:30:00'
          }
        ],
        eventClick: function (info) {
          const event = info.event;
          document.getElementById('eventTitle').textContent = event.title;
          document.getElementById('eventStart').textContent = event.start.toLocaleString();
          document.getElementById('eventEnd').textContent = event.end
            ? event.end.toLocaleString()
            : '-';
          const modal = new bootstrap.Modal(document.getElementById('eventModal'));
          modal.show();
        }
      });

      calendar.render();
    });
  </script>
